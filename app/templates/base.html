<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Mamma Mia Pizza</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Optional: Bootstrap for quick styling -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
  <div class="mb-3 d-flex gap-2">
    <a class="btn btn-outline-secondary" href="{{ url_for('web.ui_home') }}">Home</a>
    <a class="btn btn-outline-secondary" href="{{ url_for('web.ui_menu') }}">Menu</a>
    <a class="btn btn-outline-primary" href="{{ url_for('web.ui_order_form') }}">Place Order</a>
    <a class="btn btn-outline-secondary" href="{{ url_for('web.ui_reports') }}">Reports</a>
  </div>

  {% block body %}{% endblock %}

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
