{% extends "base.html" %}
{% block body %}
<h2>Menu</h2>
<table class="table table-sm align-middle">
  <thead><tr><th>Pizza</th><th>Price</th><th>Veg</th><th>Vegan</th></tr></thead>
  <tbody>
    {% for r in rows %}
      <tr>
        <td>{{ r.pizza_name }}</td>
        <td>€ {{ '%.2f'|format(r.price|float) }}</td>
        <td>{{ '✔' if r.is_vegetarian else '' }}</td>
        <td>{{ '✔' if r.is_vegan else '' }}</td>
      </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
